<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تعديل مشروع تحسيني - عام</title>

  <script src="../../public/assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme:{ extend:{ colors:{ primary:'#002B5B' } } } }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Tajawal',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}</style>

  <link rel="stylesheet" href="../../public/assets/css/styles.css" />
  <link rel="stylesheet" href="../hospital/hospital.css">
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Header -->
  <header id="navbar" class="fixed w-full top-0 z-50 navbar-scroll" style="background-color: #002B5B;">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center">
          <img src="../../public/assets/img/logo3.png" alt="شعار تجمع مكة المكرمة الصحي" class="h-16 w-auto">
        </div>
        <nav class="hidden md:flex items-center space-x-reverse space-x-8">
          <a href="../../index/index.html" class="text-white hover:text-blue-200 transition-colors">الرئيسية</a>
          <a href="../dashboard.html" class="text-white hover:text-blue-200 transition-colors">لوحة التحكم</a>
          <a href="./list.html" class="text-white hover:text-blue-200 transition-colors">المشاريع التحسينية</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <div class="pt-24 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto px-4 md:px-6 lg:px-8">

      <!-- العنوان -->
      <div class="mb-8">
        <div class="flex items-center gap-3 mb-3">
          <span class="px-4 py-1.5 bg-blue-100 text-blue-700 rounded-full text-sm font-semibold">تعديل مشروع تحسيني</span>
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold text-primary mb-2">
          تعديل مشروع تحسيني - عام
        </h1>
        <p class="text-gray-600">
          عدّل البيانات التالية لتحديث المشروع
        </p>
      </div>

      <!-- النموذج -->
      <form id="projectForm" class="bg-white rounded-2xl shadow-lg p-6 md:p-8 space-y-6">

        <!-- معلومات أساسية -->
        <div class="border-b border-gray-200 pb-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4">معلومات أساسية</h2>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                عنوان المشروع <span class="text-red-500">*</span>
              </label>
              <input type="text" id="title" required
                     class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                  القسم <span class="text-red-500">*</span>
                </label>
                <select id="departmentId" required
                        class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                  <option value="">اختر القسم</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                  منطقة التحسين <span class="text-red-500">*</span>
                </label>
                <input type="text" id="improvementArea" required
                       class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                نوع المشروع
              </label>
              <select id="projectCategory"
                      class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">اختر نوع المشروع</option>
                <option value="وزاري">مشروع وزاري</option>
                <option value="القابضة">مشروع للصحة القابضة</option>
                <option value="20/80">مشروع 20/80</option>
                <option value="20/25">مشروع 20/25</option>
                <option value="أخرى">مشروع أخرى</option>
              </select>
            </div>
          </div>
        </div>

        <!-- وصف المشروع -->
        <div class="border-b border-gray-200 pb-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4">وصف المشروع</h2>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                وصف المشكلة <span class="text-red-500">*</span>
              </label>
              <textarea id="problemStatement" rows="4" required
                        class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                الهدف من المشروع <span class="text-red-500">*</span>
              </label>
              <textarea id="aimStatement" rows="4" required
                        class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                الحالة الحالية
              </label>
              <textarea id="currentState" rows="3"
                        class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                الحل المقترح <span class="text-red-500">*</span>
              </label>
              <textarea id="proposedSolution" rows="4" required
                        class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
            </div>
          </div>
        </div>

        <!-- مؤشرات الأداء والموارد -->
        <div class="border-b border-gray-200 pb-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4">مؤشرات الأداء والموارد</h2>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                مؤشرات الأداء (KPIs)
              </label>
              <textarea id="kpis" rows="3"
                        class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                الموارد المطلوبة
              </label>
              <textarea id="requiredResources" rows="3"
                        class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
            </div>
          </div>
        </div>

        <!-- الإدارة والجدول الزمني -->
        <div class="border-b border-gray-200 pb-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4">الإدارة والجدول الزمني</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                الأولوية
              </label>
              <select id="priority"
                      class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="LOW">منخفضة</option>
                <option value="MEDIUM">متوسطة</option>
                <option value="HIGH">عالية</option>
                <option value="CRITICAL">حرجة</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                الحالة
              </label>
              <select id="status"
                      class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="DRAFT">مسودة</option>
                <option value="PROPOSED">مقترح</option>
                <option value="APPROVED">معتمد</option>
                <option value="IN_PROGRESS">قيد التنفيذ</option>
                <option value="COMPLETED">مكتمل</option>
                <option value="CANCELLED">ملغي</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                مالك المشروع
              </label>
              <input type="text" id="projectOwner"
                     class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                مدة المشروع (بالأشهر)
              </label>
              <input type="number" id="duration" min="0"
                     class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                تاريخ البداية
              </label>
              <input type="date" id="startDate"
                     class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                تاريخ الانتهاء المتوقع
              </label>
              <input type="date" id="dueDate"
                     class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
          </div>
        </div>

        <!-- فريق العمل والملاحظات -->
        <div class="pb-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4">فريق العمل والملاحظات</h2>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                فريق العمل
              </label>
              <textarea id="teamMembers" rows="3"
                        class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="اذكر أعضاء فريق العمل"></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                ملاحظات
              </label>
              <textarea id="notes" rows="3"
                        class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
            </div>
          </div>
        </div>

        <!-- أزرار الإجراءات -->
        <div class="flex gap-4 pt-6 border-t border-gray-200">
          <button type="submit" class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-xl hover:bg-blue-700 font-semibold">
            حفظ التعديلات
          </button>
          <button type="button" onclick="history.back()" class="px-6 py-3 border border-gray-300 rounded-xl hover:bg-gray-50 font-semibold">
            إلغاء
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-[9999] hidden">
    <div id="toastInner" class="rounded-xl shadow-lg px-4 py-3 text-sm"></div>
  </div>

  <script>
    const API_BASE = localStorage.getItem('apiBase') || 'http://localhost:3001';
    const projectId = new URLSearchParams(window.location.search).get('id');
    const hospitalId = new URLSearchParams(window.location.search).get('hospitalId');

    function effectiveHospitalId() {
      const u = JSON.parse(localStorage.getItem('userData') || '{}');
      const q = new URLSearchParams(location.search);
      const fromUrl = Number(q.get('hospitalId') || q.get('hid') || 0);
      const fromLS1 = Number(localStorage.getItem('selectedHospitalId') || 0);
      const fromLS2 = Number(localStorage.getItem('hospitalId') || 0);
      const fromUser = Number(u.HospitalID || u.hospitalId || u.hid || 0);
      return fromUrl || fromLS1 || fromLS2 || fromUser || null;
    }

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('token') || ''}`
      };
    }

    const toast = (msg, type = 'info') => {
      const el = document.getElementById('toast');
      const box = document.getElementById('toastInner');
      if (!el || !box) return;
      const colors = {
        success: 'bg-green-500 text-white',
        error: 'bg-red-500 text-white',
        warn: 'bg-yellow-500 text-white',
        info: 'bg-blue-500 text-white'
      };
      box.className = `rounded-xl shadow-lg px-4 py-3 text-sm ${colors[type] || colors.info}`;
      box.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    };

    // تحميل الأقسام
    async function loadDepartments() {
      const hid = effectiveHospitalId() || hospitalId;
      if (!hid) return;

      try {
        const res = await fetch(`${API_BASE}/api/departments?hospitalId=${hid}`, {
          headers: authHeaders()
        });
        if (!res.ok) {
          console.warn('Failed to load departments:', res.status);
          return;
        }

        const json = await res.json();
        // Handle different response formats
        const depts = json.data || json.items || json || [];
        const select = document.getElementById('departmentId');
        if (!select) return;

        // Clear existing options except the first one
        while (select.options.length > 1) {
          select.remove(1);
        }

        depts.forEach(dept => {
          const option = document.createElement('option');
          option.value = dept.DepartmentID || dept.id;
          option.textContent = dept.NameAr || dept.nameAr || dept.Name || dept.name || `قسم ${dept.DepartmentID || dept.id}`;
          select.appendChild(option);
        });
      } catch (err) {
        console.error('Error loading departments:', err);
      }
    }

    // تحميل المشروع
    async function loadProject() {
      if (!projectId) {
        toast('معرف المشروع غير صحيح', 'error');
        return;
      }

      const hid = effectiveHospitalId() || hospitalId;
      if (!hid) {
        toast('لم يتم تحديد المستشفى', 'error');
        return;
      }

      try {
        const res = await fetch(
          `${API_BASE}/api/improvements/other/${projectId}${hid ? '?hospitalId=' + hid : ''}`,
          { headers: authHeaders() }
        );

        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }

        const json = await res.json();
        if (!json.success || !json.data) {
          throw new Error('المشروع غير موجود');
        }

        const p = json.data;

        // تعبئة الحقول
        document.getElementById('title').value = p.Title || '';
        document.getElementById('departmentId').value = p.DepartmentID || '';
        document.getElementById('improvementArea').value = p.ImprovementArea || '';
        document.getElementById('projectCategory').value = p.ProjectCategory || '';
        document.getElementById('problemStatement').value = p.ProblemStatement || '';
        document.getElementById('aimStatement').value = p.AimStatement || '';
        document.getElementById('currentState').value = p.CurrentState || '';
        document.getElementById('proposedSolution').value = p.ProposedSolution || '';
        document.getElementById('kpis').value = p.KPIs || '';
        document.getElementById('requiredResources').value = p.RequiredResources || '';
        document.getElementById('priority').value = p.Priority || 'MEDIUM';
        document.getElementById('status').value = p.Status || 'DRAFT';
        document.getElementById('projectOwner').value = p.ProjectOwner || '';
        document.getElementById('duration').value = p.DurationMonths || '';
        document.getElementById('startDate').value = p.StartDate ? p.StartDate.split('T')[0] : '';
        document.getElementById('dueDate').value = p.DueDate ? p.DueDate.split('T')[0] : '';
        document.getElementById('teamMembers').value = p.TeamMembers || '';
        document.getElementById('notes').value = p.Notes || '';
      } catch (err) {
        console.error('Error loading project:', err);
        toast('فشل في تحميل المشروع', 'error');
      }
    }

    // حفظ التعديلات
    document.getElementById('projectForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const hid = effectiveHospitalId() || hospitalId;
      if (!hid) {
        toast('لم يتم تحديد المستشفى', 'error');
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الحفظ...';

      try {
        const payload = {
          Title: document.getElementById('title').value.trim(),
          DepartmentID: Number(document.getElementById('departmentId').value),
          ImprovementArea: document.getElementById('improvementArea').value.trim(),
          ProjectCategory: document.getElementById('projectCategory').value || null,
          ProblemStatement: document.getElementById('problemStatement').value.trim(),
          AimStatement: document.getElementById('aimStatement').value.trim(),
          CurrentState: document.getElementById('currentState').value.trim() || null,
          ProposedSolution: document.getElementById('proposedSolution').value.trim(),
          KPIs: document.getElementById('kpis').value.trim() || null,
          RequiredResources: document.getElementById('requiredResources').value.trim() || null,
          Priority: document.getElementById('priority').value,
          ProjectOwner: document.getElementById('projectOwner').value.trim() || null,
          StartDate: document.getElementById('startDate').value || null,
          DueDate: document.getElementById('dueDate').value || null,
          DurationMonths: document.getElementById('duration').value ? Number(document.getElementById('duration').value) : null,
          TeamMembers: document.getElementById('teamMembers').value.trim() || null,
          Notes: document.getElementById('notes').value.trim() || null,
          Status: document.getElementById('status').value
        };

        const res = await fetch(
          `${API_BASE}/api/improvements/other/${projectId}${hid ? '?hospitalId=' + hid : ''}`,
          {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify(payload)
          }
        );

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({ message: 'خطأ غير معروف' }));
          throw new Error(errorData.message || 'HTTP ' + res.status);
        }

        toast('تم حفظ التعديلات بنجاح ✅', 'success');
        setTimeout(() => {
          window.location.href = `view_other.html?id=${projectId}${hid ? '&hospitalId=' + hid : ''}`;
        }, 1000);
      } catch (err) {
        console.error('Error saving project:', err);
        toast('فشل في حفظ التعديلات: ' + err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'حفظ التعديلات';
      }
    });

    // تحميل البيانات عند تحميل الصفحة
    document.addEventListener('DOMContentLoaded', async () => {
      await loadDepartments();
      await loadProject();
    });
  </script>
</body>
</html>
